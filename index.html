<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f4d"><title>SYSTEP · Agri-Track 241</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#eef2f7;color:#0b1f4d;padding:46px 0 64px}
header{position:fixed;top:0;left:0;right:0;height:46px;background:#0b1f4d;color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:1000;border-bottom:3px solid #fcd116}
header b{font-size:17px;flex:1}header img{height:26px;background:#fff;border-radius:5px;padding:2px}header button{background:none;border:0;color:#fff;font-size:21px;position:relative}
#badge{display:none;position:absolute;top:2px;right:0;width:9px;height:9px;border-radius:50%;background:#e33}
.card{background:#fff;margin:10px;padding:14px;border-radius:14px;box-shadow:0 1px 4px #0002}.card h3{margin:0 0 10px}
.map{height:52vh;min-height:300px;z-index:1}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.tile{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 4px #0002;cursor:pointer}.tile:active{transform:scale(.97)}.tile span{font-size:22px}.tile b{font-size:22px}.tile small{color:#667}
label{display:block;font-size:13px;font-weight:600;margin:8px 0}input,select{display:block;width:100%;padding:11px;margin-top:4px;border:2px solid #d6dff0;border-radius:10px;background:#eaf0fd;font-size:16px}
.gps{display:flex;gap:6px}.b{display:block;width:100%;padding:13px;margin:8px 0;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:700}.g{background:#219e56}.n{background:#0b1f4d}.r{background:#d9534f}
.row{padding:10px 0;border-bottom:1px solid #e3e8f0;display:flex;flex-direction:column}.row small,.mut{color:#667}.err{color:#d9534f}.lk{display:block;text-align:center;color:#2f6fbd;font-weight:700;margin-top:8px}
.bar{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:13px}.bar span{width:34%}.bar i{height:12px;background:#f26b21;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}th,td{border:1px solid #ccd;padding:5px;text-align:left}th{background:#eaf0fd}.tot{font-weight:700;background:#fff7d6}
nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:1000}nav a{flex:1;text-align:center;font-size:10px;padding-top:6px;color:#667}nav a span{display:block;font-size:20px}nav a.on{color:#f26b21;font-weight:700}
#drawer{display:none;position:fixed;inset:46px 0 0;z-index:1500}#drawer.open{display:flex}.dp{width:75%;background:#fff;padding:16px;overflow:auto}.dp a{display:block;padding:13px 0;font-weight:600}.dbg{flex:1;background:#0006}
@media print{header,nav,.noprint,#drawer,.map{display:none!important}body{padding:0;background:#fff}.card{box-shadow:none;margin:0}}
</style></head><body>
<header><button onclick="A.menu()">☰</button><img src="assets/logos.png" alt=""><b>SYSTEP</b><button onclick="A.go('notif')">🔔<i id="badge"></i></button><button onclick="A.user()">👤</button></header>
<main id="main"></main><nav id="nav"></nav><div id="drawer"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="app.js"></script></body></html>
