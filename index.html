#drawer{display:none;position:fixed;inset:46px 0 0;z-index:1500}#drawer.open{display:flex}.dp{width:75%;background:#fff;padding:16px;overflow:auto}.dp a{display:block;padding:13px 0;font-weight:600}.dbg{flex:1;background:#0006}
.srch{margin:10px 10px 0;position:relative;z-index:2}.sbar{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #c9d5ea;border-radius:14px;padding:3px 6px 3px 12px}.sbar input{border:0;background:none;margin:0;flex:1;padding:9px 4px}
.sbar button{border:0;background:#eaf0fd;border-radius:10px;font-size:19px;padding:8px 11px;position:relative}.sbar i{font-style:normal;position:absolute;top:-5px;right:-5px;min-width:17px;background:#f26b21;color:#fff;font-size:11px;border-radius:9px}.sbar i:empty{display:none}
.fpn{display:none;background:rgba(255,255,255,.96);border-radius:14px;padding:4px 12px 8px;margin-top:8px;box-shadow:0 1px 4px #0002}.fpn.open{display:block}
@media print{header,nav,.noprint,#drawer,.map{display:none!important}body{padding:0;background:#fff}.card{box-shadow:none;margin:0}}

main{position:relative;z-index:1}
#splash{position:fixed;inset:0;z-index:3000;background:linear-gradient(#cfe9f5,#eef8ee);animation:out .7s 5.4s forwards}#splash svg{width:100%;height:100%}
@keyframes out{to{opacity:0;visibility:hidden}}
.st{fill:none;stroke:#3f7d2c;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--t,1s) var(--d,0s) ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center bottom;transform:scale(0);animation:pp var(--t,.7s) var(--d,0s) cubic-bezier(.3,1.6,.5,1) forwards}@keyframes pp{to{transform:scale(var(--s,1))}}
.lf{fill:#4caf50}.fr{fill:#e8452c}
.egg{transform-box:fill-box;transform-origin:center bottom;animation:wob 1.5s 1.3s,fo .3s 2.9s forwards}@keyframes wob{20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}}@keyframes fo{to{opacity:0}}
.cow{transform-box:fill-box;transform-origin:center bottom;transform:scale(.4);animation:gr 3.4s 1.4s ease-in-out forwards}@keyframes gr{to{transform:scale(1)}}
.ti{opacity:0;animation:fi 1s 3.3s forwards}@keyframes fi{to{opacity:1}}
@media print{body::before{display:none}}
